<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagonal link design with geometric facets -->
  <defs>
    <!-- Blue gradients -->
    <linearGradient id="blue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- Gold/Yellow gradients -->
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde047;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ca8a04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Center of hexagonal link -->
  <g transform="translate(250, 250)">
    <!-- Bottom-left blue section -->
    <path d="M -80,-40 L -120,-80 L -80,-120 L 0,-80 Z" fill="url(#blue1)"/>
    <path d="M -80,-120 L 0,-80 L 0,-40 L -40,0 Z" fill="url(#blue2)"/>
    <path d="M -120,-80 L -80,-40 L -40,0 L -80,40 L -120,0 Z" fill="url(#blue3)"/>
    <path d="M -80,40 L -40,0 L 0,40 L 0,80 L -40,80 Z" fill="url(#blue1)"/>
    <path d="M -40,80 L 0,80 L 0,120 L -40,120 Z" fill="url(#blue2)"/>

    <!-- Top-right gold section -->
    <path d="M 80,40 L 120,80 L 80,120 L 0,80 Z" fill="url(#gold1)"/>
    <path d="M 80,120 L 0,80 L 0,40 L 40,0 Z" fill="url(#gold2)"/>
    <path d="M 120,80 L 80,40 L 40,0 L 80,-40 L 120,0 Z" fill="url(#gold3)"/>
    <path d="M 80,-40 L 40,0 L 0,-40 L 0,-80 L 40,-80 Z" fill="url(#gold1)"/>
    <path d="M 40,-80 L 0,-80 L 0,-120 L 40,-120 Z" fill="url(#gold2)"/>

    <!-- Connecting facets -->
    <path d="M -40,0 L 0,-40 L 0,40 Z" fill="#94a3b8" opacity="0.3"/>
    <path d="M 40,0 L 0,40 L 0,-40 Z" fill="#94a3b8" opacity="0.3"/>
  </g>
</svg>
